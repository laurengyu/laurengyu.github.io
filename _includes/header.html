<header class="site-header cs-header" role="banner">
  <div class="wrapper cs-header__inner">
    <a class="cs-brand" href="{{ '/shelf/' | relative_url }}">
      <img class="cs-cover" src="{{ '/assets/cover.jpg' | relative_url }}" alt="" width="56" height="56">
      <span class="cs-brand__text">
        <span class="site-title">{{ site.shelf.title | escape }}</span>
      </span>
    </a>
    <nav class="cs-nav" aria-label="Site">
      {%- for link in site.nav_links -%}
        {%- if link.url contains '://' -%}
          <a href="{{ link.url }}">{{ link.title | escape }}</a>
        {%- else -%}
          <a href="{{ link.url | relative_url }}">{{ link.title | escape }}</a>
        {%- endif -%}
      {%- endfor -%}
    </nav>
  </div>
  <div class="wrapper"><hr class="cs-rule"></div>
</header>
