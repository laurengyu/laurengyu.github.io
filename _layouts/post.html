---
layout: default
---
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
  </header>
  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>
  <p class="cs-meta"><time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%Y-%m-%d" }}</time></p>
  {%- if page.tags.size > 0 -%}
  <p class="cs-tags">{% for tag in page.tags %}<a href="{{ '/shelf/tags' | relative_url }}#{{ tag | append: "" | slugify }}">#{{ tag }}</a>{% endfor %}</p>
  {%- endif -%}
  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>
