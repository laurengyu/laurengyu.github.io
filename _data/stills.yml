# Front-page stills: one is picked at random on each visit.
# To add one: drop the image in assets/stills/ and add an entry here.
# For a tall (portrait) image, add `portrait: true`: its caption then sits at the
# image's bottom-right instead of underneath, like Gursky's site.
# `color` is the hover color for links while this still is shown. It starts as the
# still's most vivid main color (computed once, not in the browser); change it to
# any color you like, e.g. the colour that defines the film for you.
